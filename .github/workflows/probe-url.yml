name: probe-url
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe deployed site
        run: |
          U=https://cfchat.261993134.workers.dev
          echo "== GET / =="; curl -sS -o /dev/null -w "http=%{http_code} time=%{time_total}s\n" "$U/"
          echo "== 首页片段 =="; curl -sS "$U/" | head -c 300; echo
          echo "== POST /api/auth/login (空参) =="; curl -sS -w "\nhttp=%{http_code}\n" -X POST "$U/api/auth/login" -H "Content-Type: application/json" -d "{}"
